<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070D">
<title>BAN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:rgba(0,0,0,0)}
html,body{width:100%;height:100%;background:#05070D;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}

.bg{position:fixed;top:0;left:0;right:0;bottom:0;z-index:0;overflow:hidden;
  background:#070B14;
  background:-webkit-linear-gradient(160deg,#070B14,#0B1526,#05070D);
  background:linear-gradient(160deg,#070B14,#0B1526,#05070D)}
.orbwrap{position:absolute}
.orb{border-radius:50%;opacity:.55;
  -webkit-filter:blur(60px);filter:blur(60px);
  -webkit-animation:float 14s ease-in-out infinite alternate;
  animation:float 14s ease-in-out infinite alternate}
.w1{left:-90px;top:40px}
.w1 .orb{width:300px;height:300px;background:#2AA8FF}
.w2{right:-100px;top:340px}
.w2 .orb{width:260px;height:260px;background:#9B5CFF;
  -webkit-animation-duration:18s;animation-duration:18s}
.w3{left:30px;bottom:-80px}
.w3 .orb{width:220px;height:220px;background:#00E5C0;
  -webkit-animation-duration:22s;animation-duration:22s}
@-webkit-keyframes float{0%{-webkit-transform:translate3d(0,0,0)}100%{-webkit-transform:translate3d(40px,-60px,0)}}
@keyframes float{0%{transform:translate3d(0,0,0)}100%{transform:translate3d(40px,-60px,0)}}

#fx{position:fixed;top:0;left:0;right:0;bottom:0;z-index:1}

#splash{position:fixed;top:0;left:0;right:0;bottom:0;z-index:99;
  display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-orient:vertical;-webkit-flex-direction:column;flex-direction:column;
  -webkit-box-align:center;-webkit-align-items:center;align-items:center;
  -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;
  background:#05070D;-webkit-transition:opacity .8s ease;transition:opacity .8s ease}
#splash.hide{opacity:0;pointer-events:none}
.halo{position:absolute;width:280px;height:280px;border-radius:50%;
  background:#1B5C8C;opacity:.6;-webkit-filter:blur(60px);filter:blur(60px);
  -webkit-animation:breathe 2.4s ease-in-out infinite;animation:breathe 2.4s ease-in-out infinite}
@-webkit-keyframes breathe{0%,100%{-webkit-transform:scale(1)}50%{-webkit-transform:scale(1.15)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.word{position:relative;z-index:2;text-align:center;white-space:nowrap}
.word span{display:inline-block;font-size:80px;font-weight:900;letter-spacing:4px;line-height:1;
  color:#9BE9FF;opacity:0;
  -webkit-transform:translate3d(0,70px,0) scale(.65);transform:translate3d(0,70px,0) scale(.65);
  -webkit-animation:pop 1.1s ease-out forwards;animation:pop 1.1s ease-out forwards}
.word span:nth-child(1){-webkit-animation-delay:.05s;animation-delay:.05s}
.word span:nth-child(2){-webkit-animation-delay:.21s;animation-delay:.21s}
.word span:nth-child(3){-webkit-animation-delay:.37s;animation-delay:.37s}
@-webkit-keyframes pop{100%{opacity:1;-webkit-transform:translate3d(0,0,0) scale(1)}}
@keyframes pop{100%{opacity:1;transform:translate3d(0,0,0) scale(1)}}
.bar{margin-top:26px;width:190px;height:6px;border-radius:50px;position:relative;
  overflow:hidden;background:rgba(255,255,255,.12);z-index:2}
.bar:after{content:"";position:absolute;top:0;left:-45%;width:45%;height:100%;
  background:#8FE6FF;opacity:.7;
  -webkit-animation:sweep 2.2s linear infinite;animation:sweep 2.2s linear infinite}
@-webkit-keyframes sweep{100%{left:100%}}
@keyframes sweep{100%{left:100%}}
.load{margin-top:14px;font-size:11px;letter-spacing:6px;z-index:2;color:rgba(255,255,255,.5)}

#app{position:fixed;top:0;left:0;right:0;bottom:0;z-index:2;
  display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-orient:vertical;-webkit-flex-direction:column;flex-direction:column;
  opacity:0;-webkit-transition:opacity .8s ease;transition:opacity .8s ease}
#app.show{opacity:1}
.page{-webkit-box-flex:1;-webkit-flex:1;flex:1;overflow-y:auto;overflow-x:hidden;
  padding:56px 20px 12px;-webkit-overflow-scrolling:touch}
.page h1{font-size:32px;font-weight:900;color:#fff}
.page h1 small{display:block;font-size:13px;font-weight:400;
  color:rgba(255,255,255,.5);margin-top:4px}

.card{margin-top:14px;padding:18px;border-radius:22px;position:relative;overflow:hidden;
  background:#1A2333;border:1px solid rgba(255,255,255,.25);
  color:rgba(255,255,255,.92);font-size:17px;font-weight:700}
.card small{display:block;font-size:12px;font-weight:400;
  color:rgba(255,255,255,.5);margin-top:6px}
.card:after{content:"";position:absolute;top:-40%;left:-70%;width:45%;height:180%;
  background:rgba(255,255,255,.18);
  -webkit-transform:skewX(-18deg);transform:skewX(-18deg);
  -webkit-animation:shine 3.4s linear infinite;animation:shine 3.4s linear infinite}
@-webkit-keyframes shine{0%{left:-70%}55%,100%{left:135%}}
@keyframes shine{0%{left:-70%}55%,100%{left:135%}}
a.card{display:block;text-decoration:none;color:rgba(255,255,255,.92)}

.dl{margin-top:24px;padding:26px 20px;text-align:center;border-radius:26px;
  background:#2B6CB0;border:1px solid rgba(255,255,255,.45);
  font-size:20px;font-weight:900;letter-spacing:2px}
.dl small{font-size:12px;letter-spacing:1px;color:rgba(255,255,255,.7);margin-top:8px}

.tabbar{display:-webkit-box;display:-webkit-flex;display:flex;padding:10px 16px 22px}
.tab{-webkit-box-flex:1;-webkit-flex:1;flex:1;position:relative;overflow:hidden;
  margin-right:10px;border-radius:24px;padding:13px 0;text-align:center;cursor:pointer;
  background:#243247;border:1px solid rgba(255,255,255,.3);
  color:rgba(255,255,255,.88);font-size:12px;
  -webkit-transition:-webkit-transform .4s ease;transition:transform .4s ease}
.tab:last-child{margin-right:0}
.tab .ico{font-size:20px;display:block;margin-bottom:4px;line-height:1}
.tab.on{-webkit-transform:scale(1.08);transform:scale(1.08);
  background:#35507A;border-color:rgba(255,255,255,.6)}

/* ===== 音乐页 ===== */
.search{margin-top:16px}
.search input{width:100%;padding:14px 16px;border-radius:18px;
  border:1px solid rgba(255,255,255,.25);background:#1A2333;color:#fff;
  font-size:14px;outline:none}
.search input::-webkit-input-placeholder{color:rgba(255,255,255,.35)}
.status{margin-top:12px;font-size:12px;color:rgba(255,255,255,.5);text-align:center;min-height:16px}

.song-item{display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-align:center;-webkit-align-items:center;align-items:center;
  margin-top:10px;padding:10px;border-radius:18px;background:#1A2333;
  border:1px solid rgba(255,255,255,.18);cursor:pointer}
.song-item.on{border-color:#4FA8FF;background:#22314D}
.thumb{width:44px;height:44px;border-radius:12px;margin-right:12px;
  -webkit-flex:0 0 44px;flex:0 0 44px;
  display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-align:center;-webkit-align-items:center;align-items:center;
  -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;
  font-weight:900;color:#fff;font-size:18px;
  background-size:cover;background-position:center;overflow:hidden}
.song-item b{font-size:14px;color:#fff;font-weight:700;display:block;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
.song-item p{font-size:12px;color:rgba(255,255,255,.5);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
.empty{margin-top:24px;text-align:center;font-size:13px;color:rgba(255,255,255,.4)}

.player{margin-top:22px;padding:18px;border-radius:24px;background:#141C2B;
  border:1px solid rgba(255,255,255,.2)}
.disc{width:150px;height:150px;border-radius:50%;margin:0 auto;
  display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-align:center;-webkit-align-items:center;align-items:center;
  -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;
  font-size:44px;font-weight:900;color:#fff;
  border:3px solid rgba(255,255,255,.18);
  background-size:cover;background-position:center;
  -webkit-animation:spin 14s linear infinite;animation:spin 14s linear infinite}
.disc.pause{-webkit-animation-play-state:paused;animation-play-state:paused}
@-webkit-keyframes spin{100%{-webkit-transform:rotate(360deg)}}
@keyframes spin{100%{transform:rotate(360deg)}}
.song{text-align:center;margin-top:20px;color:#fff}
.song b{font-size:17px}
.song p{font-size:12px;color:rgba(255,255,255,.5);margin-top:4px}
.track{margin:20px 0 0;height:5px;border-radius:50px;overflow:hidden;
  background:rgba(255,255,255,.14)}
.track i{display:block;height:100%;width:0;border-radius:50px;background:#4FA8FF}
.btns{text-align:center;margin-top:24px}
.btns button{background:none;border:none;color:rgba(255,255,255,.85);
  font-size:28px;cursor:pointer;margin:0 12px;vertical-align:middle}
.play{width:64px;height:64px;border-radius:50%;font-size:26px;color:#fff;
  background:#3E5A8C;border:1px solid rgba(255,255,255,.5)}

#toast{position:fixed;left:16px;right:16px;bottom:112px;z-index:80;
  display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-align:center;-webkit-align-items:center;align-items:center;
  padding:12px 14px;border-radius:20px;background:#1E2A44;
  border:1px solid rgba(255,255,255,.3);
  opacity:0;-webkit-transform:translate3d(0,40px,0);transform:translate3d(0,40px,0);
  -webkit-transition:opacity .45s ease,-webkit-transform .45s ease;
  transition:opacity .45s ease,transform .45s ease;pointer-events:none}
#toast.show{opacity:1;-webkit-transform:translate3d(0,0,0);transform:translate3d(0,0,0)}
#toast .thumb{width:40px;height:40px;border-radius:10px;
  -webkit-flex:0 0 40px;flex:0 0 40px;margin-right:12px;font-size:16px}
#toast b{font-size:14px;color:#fff;display:block;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:210px}
#toast p{font-size:11px;color:rgba(255,255,255,.55);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:210px}
</style>
</head>
<body>

<div class="bg">
  <div class="orbwrap w1"><div class="orb"></div></div>
  <div class="orbwrap w2"><div class="orb"></div></div>
  <div class="orbwrap w3"><div class="orb"></div></div>
</div>
<canvas id="fx"></canvas>

<div id="splash">
  <div class="halo"></div>
  <div class="word"><span>B</span><span>A</span><span>N</span></div>
  <div class="bar"></div>
  <div class="load">LOADING</div>
</div>

<div id="app">
  <div class="page" id="page"></div>
  <div class="tabbar">
    <div class="tab on" data-i="0"><span class="ico">🏠</span>主页</div>
    <div class="tab" data-i="1"><span class="ico">↗</span>跳转</div>
    <div class="tab" data-i="2"><span class="ico">🎵</span>音乐</div>
  </div>
</div>

<div id="toast">
  <div class="thumb" id="toastCover">♪</div>
  <div>
    <b id="toastTitle"></b>
    <p id="toastArtist"></p>
  </div>
</div>

<script>
(function(){

  /* ==================== 配置 ==================== */
  // 数据源：'archive'（不用注册）或 'jamendo'（需要 client_id）
  var SOURCE = 'archive';

  // 想用 Jamendo 的话，去 https://devportal.jamendo.com 免费注册，把 client_id 填这里
  var JAMENDO_ID = '';

  /* ==================== 粒子背景 ==================== */
  var cvs = document.getElementById('fx');
  var ctx = cvs.getContext('2d');
  var W = 0, H = 0, parts = [];
  var COLORS = ['79,195,255','155,92,255','0,229,192'];

  function resize(){
    var dpr = window.devicePixelRatio || 1;
    if (dpr > 2) dpr = 2;
    W = window.innerWidth; H = window.innerHeight;
    cvs.width = W * dpr; cvs.height = H * dpr;
    cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var n = Math.round(W * H / 18000);
    if (n < 24) n = 24;
    if (n > 50) n = 50;

    parts = [];
    for (var i = 0; i < n; i++){
      parts.push({
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - .5) * .28, vy: (Math.random() - .5) * .28,
        r: Math.random() * 1.8 + .8,
        c: COLORS[Math.floor(Math.random() * COLORS.length)],
        p: Math.random() * Math.PI * 2
      });
    }
  }

  function loop(t){
    ctx.clearRect(0, 0, W, H);
    var i, j, a, b, dx, dy, d2, o;

    for (i = 0; i < parts.length; i++){
      a = parts[i];
      a.x += a.vx; a.y += a.vy;
      if (a.x < -20) a.x = W + 20;
      if (a.x > W + 20) a.x = -20;
      if (a.y < -20) a.y = H + 20;
      if (a.y > H + 20) a.y = -20;

      ctx.beginPath();
      ctx.arc(a.x, a.y, a.r, 0, 6.2832);
      ctx.fillStyle = 'rgba(' + a.c + ',' + (.35 + Math.sin(t / 900 + a.p) * .25) + ')';
      ctx.fill();
    }

    for (i = 0; i < parts.length; i++){
      for (j = i + 1; j < parts.length; j++){
        a = parts[i]; b = parts[j];
        dx = a.x - b.x; dy = a.y - b.y;
        d2 = dx * dx + dy * dy;
        if (d2 < 12100){
          o = (1 - d2 / 12100) * .16;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = 'rgba(140,200,255,' + o + ')';
          ctx.lineWidth = .7;
          ctx.stroke();
        }
      }
    }
    window.requestAnimationFrame(loop);
  }

  resize();
  window.addEventListener('resize', resize);
  window.requestAnimationFrame(loop);

  /* ==================== 工具 ==================== */
  var PALETTE = ['#3E7CFF','#9B5CFF','#00B894','#E17055','#0984E3','#6C5CE7'];

  function colorOf(str){
    str = String(str);
    var h = 0;
    for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 99991;
    return PALETTE[h % PALETTE.length];
  }

  function initial(txt){ return txt ? txt.substring(0, 1) : '♪'; }

  function buzz(ms){ if (navigator.vibrate) { try { navigator.vibrate(ms); } catch(e){} } }

  function setStatus(txt){
    var el = document.getElementById('status');
    if (el) el.innerHTML = txt || '';
  }

  /* ==================== 状态 ==================== */
  var RESULTS = [];
  var current = -1;
  var playing = false;
  var audio = new Audio();
  var toastTimer = null;
  var searchTimer = null;

  /* ==================== 搜索：Internet Archive ==================== */
  function archiveSearch(kw){
    setStatus('搜索中…');
    var url = 'https://archive.org/advancedsearch.php?q='
      + encodeURIComponent(kw + ' AND mediatype:(audio)')
      + '&fl%5B%5D=identifier&fl%5B%5D=title&fl%5B%5D=creator'
      + '&rows=25&page=1&output=json';

    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.onload = function(){
      try {
        var data = JSON.parse(xhr.responseText);
        var docs = (data.response && data.response.docs) || [];
        RESULTS = [];
        for (var i = 0; i < docs.length; i++){
          var d = docs[i];
          var artist = '未知';
          if (d.creator){
            artist = (typeof d.creator === 'string') ? d.creator : d.creator.join(', ');
          }
          RESULTS.push({
            id: d.identifier,
            title: d.title || d.identifier,
            artist: artist,
            src: '',
            cover: '',
            color: colorOf(d.identifier)
          });
        }
        renderList();
        setStatus(RESULTS.length ? '' : '没有找到相关音乐');
      } catch(e){
        setStatus('解析失败，换个词试试');
      }
    };
    xhr.onerror = function(){ setStatus('网络失败：连不上 archive.org'); };
    xhr.send();
  }

  function archiveResolve(idx){
    var s = RESULTS[idx];
    setStatus('加载音频…');

    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'https://archive.org/metadata/' + encodeURIComponent(s.id), true);
    xhr.onload = function(){
      try {
        var m = JSON.parse(xhr.responseText);
        var files = m.files || [];
        var pick = '';
        for (var i = 0; i < files.length; i++){
          var nm = (files[i].name || '');
          if (nm.toLowerCase().indexOf('.mp3') >= 0){ pick = nm; break; }
        }
        if (!pick){
          setStatus('这首没有可播放的 mp3');
          return;
        }
        var segs = pick.split('/');
        for (var k = 0; k < segs.length; k++) segs[k] = encodeURIComponent(segs[k]);
        s.src = 'https://archive.org/download/' + encodeURIComponent(s.id) + '/' + segs.join('/');
        setStatus('');
        startPlay(idx);
      } catch(e){
        setStatus('加载失败');
      }
    };
    xhr.onerror = function(){ setStatus('网络失败'); };
    xhr.send();
  }

  /* ==================== 搜索：Jamendo（JSONP，无跨域问题） ==================== */
  function jamendoSearch(kw){
    if (!JAMENDO_ID){
      setStatus('请先在代码里填 JAMENDO_ID');
      return;
    }
    setStatus('搜索中…');

    var cbName = 'jmcb' + Math.floor(Math.random() * 1e9);
    window[cbName] = function(res){
      try {
        var list = (res && res.results) || [];
        RESULTS = [];
        for (var i = 0; i < list.length; i++){
          var t = list[i];
          RESULTS.push({
            id: t.id,
            title: t.name,
            artist: t.artist_name,
            src: t.audio || '',
            cover: t.image || '',
            color: colorOf(t.id)
          });
        }
        renderList();
        setStatus(RESULTS.length ? '' : '没有找到相关音乐');
      } catch(e){
        setStatus('解析失败');
      }
      try { delete window[cbName]; } catch(e){ window[cbName] = undefined; }
    };

    var sc = document.createElement('script');
    sc.src = 'https://api.jamendo.com/v3.0/tracks/?client_id=' + encodeURIComponent(JAMENDO_ID)
      + '&format=jsonp&callback=' + cbName
      + '&limit=25&search=' + encodeURIComponent(kw)
      + '&audioformat=mp32';
    sc.onerror = function(){ setStatus('网络失败：连不上 jamendo'); };
    document.body.appendChild(sc);
  }

  function doSearch(kw){
    if (!kw || kw.length < 1){ setStatus(''); return; }
    if (SOURCE === 'jamendo') jamendoSearch(kw);
    else archiveSearch(kw);
  }

  /* ==================== 列表渲染 ==================== */
  function renderList(){
    var list = document.getElementById('list');
    if (!list) return;

    if (!RESULTS.length){
      list.innerHTML = '<div class="empty">输入关键字搜索音乐</div>';
      return;
    }

    var html = '';
    for (var i = 0; i < RESULTS.length; i++){
      var s = RESULTS[i];
      var bg = s.cover ? ('background-image:url(' + s.cover + ')') : ('background:' + s.color);
      html += ''
        + '<div class="song-item' + (i === current ? ' on' : '') + '" data-idx="' + i + '">'
        +   '<div class="thumb" style="' + bg + '">' + (s.cover ? '' : initial(s.title)) + '</div>'
        +   '<div><b>' + s.title + '</b><p>' + s.artist + '</p></div>'
        + '</div>';
    }
    list.innerHTML = html;

    var items = list.querySelectorAll('.song-item');
    for (var k = 0; k < items.length; k++){
      (function(el){
        el.onclick = function(){
          pickSong(parseInt(el.getAttribute('data-idx'), 10));
        };
      })(items[k]);
    }
  }

  /* ==================== 播放 ==================== */
  function pickSong(idx){
    var s = RESULTS[idx];
    if (!s) return;
    current = idx;
    showToast(s);
    buzz(12);

    if (s.src){ startPlay(idx); }
    else if (SOURCE === 'archive'){ archiveResolve(idx); }
    else { setStatus('这首没有音频文件'); }
  }

  function startPlay(idx){
    var s = RESULTS[idx];
    try {
      audio.src = s.src;
      audio.play();
      playing = true;
    } catch(e){
      playing = false;
      setStatus('播放失败');
    }
    updateUI();
  }

  function toggle(){
    if (current < 0){
      if (RESULTS.length) pickSong(0);
      return;
    }
    if (!RESULTS[current].src){ pickSong(current); return; }

    if (playing){ audio.pause(); playing = false; }
    else { try { audio.play(); playing = true; } catch(e){} }
    updateUI();
    buzz(10);
  }

  function updateUI(){
    var s = RESULTS[current];
    var disc = document.getElementById('disc');
    var btn = document.getElementById('playBtn');

    if (s){
      document.getElementById('nowTitle').innerHTML = s.title;
      document.getElementById('nowArtist').innerHTML = s.artist;
      if (s.cover){
        disc.style.backgroundImage = 'url(' + s.cover + ')';
        disc.innerHTML = '';
      } else {
        disc.style.backgroundImage = 'none';
        disc.style.background = s.color;
        disc.innerHTML = initial(s.title);
      }
    }

    if (playing){ disc.className = 'disc'; btn.innerHTML = '&#10074;&#10074;'; }
    else { disc.className = 'disc pause'; btn.innerHTML = '&#9654;'; }

    var items = document.querySelectorAll('.song-item');
    for (var i = 0; i < items.length; i++){
      items[i].className = 'song-item' +
        (parseInt(items[i].getAttribute('data-idx'), 10) === current ? ' on' : '');
    }
  }

  /* ==================== 正在播放弹窗 ==================== */
  function showToast(s){
    var t = document.getElementById('toast');
    var cover = document.getElementById('toastCover');

    if (s.cover){
      cover.style.backgroundImage = 'url(' + s.cover + ')';
      cover.innerHTML = '';
    } else {
      cover.style.backgroundImage = 'none';
      cover.style.background = s.color;
      cover.innerHTML = initial(s.title);
    }

    document.getElementById('toastTitle').innerHTML = s.title;
    document.getElementById('toastArtist').innerHTML = s.artist;

    t.className = 'show';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.className = ''; }, 3000);
  }

  /* ==================== 页面 ==================== */
  var page = document.getElementById('page');

  var HOME = ''
    + '<h1>BAN<small>欢迎回来</small></h1>'
    + '<a class="card dl" href="https://www.example.com">前往下载<small>点击开始下载</small></a>';

  var JUMP = ''
    + '<h1>跳转<small>点击卡片打开链接</small></h1>'
    + '<a class="card" href="https://www.baidu.com">链接一<small>baidu.com</small></a>'
    + '<a class="card" href="https://www.bing.com">链接二<small>bing.com</small></a>';

  var MUSIC = ''
    + '<h1>音乐<small>搜索并播放</small></h1>'
    + '<div class="search"><input id="q" type="text" placeholder="搜索歌曲，例如 piano / jazz"></div>'
    + '<div class="status" id="status"></div>'
    + '<div id="list"></div>'
    + '<div class="player">'
    +   '<div class="disc pause" id="disc" style="background:#2B3550">♪</div>'
    +   '<div class="song"><b id="nowTitle">未播放</b><p id="nowArtist">从上面选一首歌</p></div>'
    +   '<div class="track"><i id="prog"></i></div>'
    +   '<div class="btns">'
    +     '<button id="prev">&#9198;</button>'
    +     '<button class="play" id="playBtn">&#9654;</button>'
    +     '<button id="next">&#9197;</button>'
    +   '</div>'
    + '</div>';

  function bind(){
    var q = document.getElementById('q');
    if (q){
      q.oninput = function(){
        var kw = q.value;
        if (searchTimer) clearTimeout(searchTimer);
        if (kw.length < 1){ RESULTS = []; renderList(); setStatus(''); return; }
        searchTimer = setTimeout(function(){ doSearch(kw); }, 500);
      };
      q.onkeyup = q.oninput;
    }

    var btn = document.getElementById('playBtn');
    if (btn) btn.onclick = toggle;

    var p = document.getElementById('prev');
    if (p) p.onclick = function(){
      if (!RESULTS.length) return;
      pickSong(current <= 0 ? RESULTS.length - 1 : current - 1);
    };

    var n = document.getElementById('next');
    if (n) n.onclick = function(){
      if (!RESULTS.length) return;
      pickSong(current >= RESULTS.length - 1 ? 0 : current + 1);
    };

    renderList();
    updateUI();
  }

  audio.addEventListener('timeupdate', function(){
    var bar = document.getElementById('prog');
    if (!bar || !audio.duration) return;
    bar.style.width = (audio.currentTime / audio.duration * 100) + '%';
  });

  audio.addEventListener('ended', function(){
    if (!RESULTS.length) return;
    pickSong(current >= RESULTS.length - 1 ? 0 : current + 1);
  });

  audio.addEventListener('error', function(){
    if (audio.src) setStatus('音频加载失败，换一首试试');
  });

  /* ==================== 切换页 ==================== */
  function render(i){
    page.innerHTML = [HOME, JUMP, MUSIC][i];
    page.scrollTop = 0;
    if (i === 2) bind();
  }

  var tabs = document.querySelectorAll('.tab');
  for (var k = 0; k < tabs.length; k++){
    (function(t){
      t.onclick = function(){
        for (var m = 0; m < tabs.length; m++) tabs[m].className = 'tab';
        t.className = 'tab on';
        buzz(12);
        render(parseInt(t.getAttribute('data-i'), 10));
      };
    })(tabs[k]);
  }

  render(0);

  setTimeout(function(){
    var sp = document.getElementById('splash');
    sp.className = 'hide';
    document.getElementById('app').className = 'show';
    setTimeout(function(){
      if (sp.parentNode) sp.parentNode.removeChild(sp);
    }, 900);
  }, 2300);

})();
</script>
</body>
</html>
